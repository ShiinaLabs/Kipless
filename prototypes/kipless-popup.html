<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kipless popup prototypes</title>
  <style>
    :root {
      color-scheme: light;
      --kipless-accent: #0a84ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    @supports (color: AccentColor) {
      :root { --kipless-accent: AccentColor; }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: #eef1f4;
    }

    body[data-prototype="quiet"] { background: #eef1f4; }
    body[data-prototype="rail"] { background: #f3f3f2; }
    body[data-prototype="focus"] { background: #d9dde0; }

    button, select, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px 96px;
    }

    .mock-window {
      width: min(720px, calc(100vw - 40px));
      animation: stage-in 260ms cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    @keyframes stage-in {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mock-window { animation: none; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .eyebrow {
      margin: 0 0 10px 2px;
      color: #8a9199;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .popover-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(24, 29, 34, .08);
      border-radius: 24px;
    }

    .popover-body {
      display: grid;
      min-height: 320px;
    }

    .popover-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 0 22px;
      border-top: 1px solid rgba(24, 29, 34, .08);
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 12%, transparent);
    }

    .footer-actions {
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .footer-action {
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: #7b838c;
      font-size: 12px;
      cursor: pointer;
    }

    .footer-action:hover { color: #24282d; }
    .footer-action:focus-visible,
    .primary-action:focus-visible,
    .duration-choice:focus-visible,
    .option-row:focus-within,
    .mode-choice:focus-within {
      outline: 2px solid #6e7d8e;
      outline-offset: 3px;
    }

    .primary-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      min-height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #202328;
      color: #fff;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -.01em;
      cursor: pointer;
      transition: transform 150ms ease-out, background-color 150ms ease-out, opacity 150ms ease-out;
    }

    .primary-action:hover { background: #111316; }
    .primary-action:active { transform: scale(.98); }
    .primary-action[data-stop] { background: #626a74; }

    .primary-action:disabled,
    .duration-choice:disabled,
    .option-row.is-disabled {
      cursor: default;
      opacity: .46;
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 56px;
      padding: 0 2px;
      border-bottom: 1px solid rgba(24, 29, 34, .08);
      color: inherit;
    }

    .option-row:last-child { border-bottom: 0; }

    .option-copy { display: grid; gap: 4px; }
    .option-title { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
    .option-note { color: #8b929b; font-size: 11px; line-height: 1.35; }

    .mode-list { display: grid; gap: 6px; }

    .mode-choice {
      position: relative;
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      min-height: 54px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 150ms ease-out, border-color 150ms ease-out, opacity 150ms ease-out;
    }

    .mode-choice input {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      opacity: 0;
    }

    .mode-choice input:disabled { cursor: default; }
    .mode-choice:has(input:checked) { background: #f4f6f8; border-color: #e0e4e8; }
    .mode-choice:has(input:disabled) { cursor: default; opacity: .46; }

    .mode-radio {
      width: 17px;
      height: 17px;
      margin-top: 1px;
      border: 1.5px solid #b9c0c7;
      border-radius: 50%;
      background: transparent;
      box-shadow: inset 0 0 0 3px transparent;
      transition: background-color 150ms ease-out, border-color 150ms ease-out, box-shadow 150ms ease-out;
    }

    .mode-choice input:checked + .mode-radio {
      border-color: var(--kipless-accent);
      background: var(--kipless-accent);
      box-shadow: inset 0 0 0 3px #f4f6f8;
    }

    .mode-choice .option-copy { gap: 3px; }
    .mode-choice .option-title { line-height: 1.2; }
    .mode-choice .option-note { line-height: 1.3; }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 36px;
      height: 22px;
    }

    .switch input {
      position: absolute;
      inset: 0;
      z-index: 1;
      margin: 0;
      cursor: pointer;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #cfd4da;
      transition: background-color 160ms ease-out;
    }

    .switch-track::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
      content: "";
      transition: transform 160ms ease-out;
    }

    .switch input:checked + .switch-track { background: var(--kipless-accent); }
    .switch input:checked + .switch-track::after { transform: translateX(14px); }
    .switch input:disabled { cursor: default; }

    /* Quiet Ring — spacious split layout, with the ring as the anchor. */
    .variant-quiet {
      color: #272c31;
      background: transparent;
    }

    .quiet-card {
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 24px 60px rgba(43, 51, 60, .12), 0 2px 8px rgba(43, 51, 60, .05);
      backdrop-filter: blur(24px);
    }

    .mock-window.variant-quiet { width: min(640px, calc(100vw - 64px)); }

    .quiet-body {
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      aspect-ratio: 2 / 1;
    }

    .quiet-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      padding: 18px 24px;
      border-right: 1px solid rgba(24, 29, 34, .08);
      text-align: center;
    }

    .quiet-kicker {
      color: #8b929b;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .quiet-timer {
      position: relative;
      display: grid;
      place-items: center;
      width: 176px;
      height: 176px;
    }

    .quiet-ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .quiet-ring circle { fill: none; stroke-width: 6; }
    .quiet-ring .ring-track { stroke: #e3e6e9; }
    .quiet-ring .ring-progress {
      stroke: var(--kipless-accent);
      stroke-linecap: round;
      stroke-dasharray: 411.3 16;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 220ms linear;
    }

    .quiet-time { display: grid; justify-items: center; gap: 9px; z-index: 1; }
    .quiet-time-value {
      color: #1e2328;
      font-size: 24px;
      font-variant-numeric: tabular-nums;
      font-weight: 560;
      letter-spacing: -.06em;
    }

    .quiet-ring-action {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #eef1f4;
      color: var(--kipless-accent);
      cursor: pointer;
      transition: transform 150ms ease-out, background-color 150ms ease-out, color 150ms ease-out;
    }

    .quiet-ring-action:hover { background: #e5e9ed; color: #2b3744; }
    .quiet-ring-action:active { transform: scale(.94); }

    .quiet-action-icon { display: block; }

    .quiet-play-icon {
      width: 0;
      height: 0;
      margin-left: 2px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid currentColor;
    }

    .quiet-stop-icon {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: currentColor;
    }

    .quiet-duration-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #8b929b;
      font-size: 10px;
    }

    .quiet-duration-select {
      padding: 5px 24px 5px 8px;
      border: 0;
      border-radius: 8px;
      outline: 0;
      background: #f0f2f4;
      color: #68727c;
      font-size: 10px;
      cursor: pointer;
    }

    .quiet-duration-select:disabled { cursor: default; opacity: .46; }

    .quiet-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      padding: 18px 24px;
    }
    .quiet-options { margin-bottom: 14px; }
    .quiet-card .option-title { font-size: 12px; }
    .quiet-card .option-note { font-size: 10px; }
    .quiet-card .popover-footer { min-height: 40px; padding: 0 18px; color: #626a73; }
    .quiet-card .brand-lockup { font-size: 12px; }
    .quiet-card .footer-action { font-size: 11px; }

    /* Progress Rail — compact information hierarchy, with a vertical duration rail. */
    .variant-rail {
      color: #24292f;
      background: transparent;
    }

    .rail-card {
      background: #fcfcfb;
      border-color: rgba(24, 29, 34, .1);
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(40, 43, 45, .1);
    }

    .rail-body { grid-template-columns: .82fr 1.18fr; min-height: 316px; }

    .rail-left {
      position: relative;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 20px;
      align-items: center;
      padding: 28px 26px 28px 30px;
      background: #f4f5f5;
      border-right: 1px solid rgba(24, 29, 34, .1);
    }

    .rail-track {
      position: relative;
      width: 8px;
      height: 164px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe2e3;
    }

    .rail-fill {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: calc(var(--progress, 0) * 100%);
      border-radius: inherit;
      background: #7b8793;
      transition: height 220ms linear;
    }

    .rail-markers {
      position: absolute;
      inset: 0 auto 0 -8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 24px;
      padding: 2px 0;
    }

    .rail-marker { width: 4px; height: 1px; background: #aeb5ba; }
    .rail-marker:first-child, .rail-marker:last-child { width: 8px; background: #879199; }

    .rail-time-block { align-self: center; }
    .rail-kicker { margin-bottom: 8px; color: #8e959b; font-size: 11px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
    .rail-time { color: #1e242a; font-size: clamp(31px, 5vw, 46px); font-variant-numeric: tabular-nums; font-weight: 620; letter-spacing: -.08em; line-height: 1; }
    .rail-state { margin-top: 10px; color: #8b9298; font-size: 12px; }

    .rail-durations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; max-width: 180px; }

    .duration-choice {
      min-width: 42px;
      height: 28px;
      padding: 0 9px;
      border: 1px solid #d8dcde;
      border-radius: 8px;
      background: transparent;
      color: #737b82;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out;
    }

    .duration-choice:hover { border-color: #aab2b8; color: #272c31; }
    .duration-choice[aria-pressed="true"] { border-color: #747f89; background: #747f89; color: #fff; }

    .rail-right { display: flex; flex-direction: column; padding: 30px 30px 24px; }
    .rail-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .rail-title { font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
    .rail-status { color: #8b9298; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .rail-options { margin-bottom: auto; }
    .rail-option-row { min-height: 62px; }
    .rail-start { align-self: flex-start; margin-top: 22px; }
    .rail-card .popover-footer { min-height: 52px; }

    /* Focus Surface — dark, high-contrast panel with a horizontal session timeline. */
    .variant-focus {
      color: #eceff1;
      background: transparent;
    }

    .focus-card {
      background: #1d2024;
      border-color: rgba(255, 255, 255, .08);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(22, 26, 30, .24), 0 2px 10px rgba(22, 26, 30, .12);
    }

    .focus-body { grid-template-columns: 1fr 1fr; min-height: 322px; }
    .focus-left { display: flex; flex-direction: column; justify-content: center; padding: 30px 34px; }
    .focus-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
    .focus-label { color: #929aa3; font-size: 11px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
    .focus-live { display: inline-flex; align-items: center; gap: 6px; color: #929aa3; font-size: 11px; }
    .focus-live::before { width: 6px; height: 6px; border-radius: 50%; background: #747e89; content: ""; }
    .focus-time { color: #f4f5f6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: clamp(34px, 6vw, 52px); font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: -.1em; line-height: 1; }
    .focus-subline { margin-top: 12px; color: #868e98; font-size: 12px; }

    .focus-timeline { position: relative; height: 20px; margin: 26px 0 20px; }
    .focus-timeline-track { position: absolute; top: 8px; right: 0; left: 0; height: 2px; background: #3c4249; }
    .focus-timeline-fill { position: absolute; top: 7px; left: 0; width: calc(var(--progress, 0) * 100%); height: 4px; border-radius: 999px; background: #a1aab3; transition: width 220ms linear; }
    .focus-timeline-dot { position: absolute; top: 3px; left: calc(var(--progress, 0) * 100% - 5px); width: 12px; height: 12px; border: 2px solid #1d2024; border-radius: 50%; background: #cbd1d6; box-shadow: 0 0 0 1px #9fa8b0; transition: left 220ms linear; }
    .focus-timeline-labels { display: flex; justify-content: space-between; color: #626b75; font-size: 10px; }

    .focus-durations { display: flex; gap: 7px; }
    .focus-durations .duration-choice { border-color: #3d444b; color: #9da5ad; }
    .focus-durations .duration-choice:hover { border-color: #6f7a84; color: #f1f2f3; }
    .focus-durations .duration-choice[aria-pressed="true"] { border-color: #9ca6af; background: #9ca6af; color: #1d2024; }

    .focus-right { padding: 30px 34px 24px; border-left: 1px solid rgba(255, 255, 255, .09); }
    .focus-right-heading { margin-bottom: 14px; }
    .focus-title { font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
    .focus-note { margin-top: 5px; color: #7f8892; font-size: 11px; }
    .focus-options { margin-bottom: 22px; }
    .focus-card .mode-choice:has(input:checked) { background: #292e34; border-color: #444c54; }
    .focus-card .mode-choice input:checked + .mode-radio { border-color: #a4adb5; background: #a4adb5; box-shadow: inset 0 0 0 3px #292e34; }
    .focus-card .option-title { color: #e6e9eb; }
    .focus-card .option-note { color: #7f8892; }
    .focus-card .switch-track { background: #41474e; }
    .focus-card .switch input:checked + .switch-track { background: #9ca6af; }
    .focus-card .switch-track::after { background: #dfe3e6; box-shadow: none; }
    .focus-card .switch input:checked + .switch-track::after { background: #1d2024; }
    .focus-start { width: 100%; background: #e7eaed; color: #1d2024; }
    .focus-start:hover { background: #fff; }
    .focus-start[data-stop] { background: #737d87; color: #fff; }
    .focus-card .popover-footer { border-color: rgba(255, 255, 255, .09); color: #c3c9ce; }
    .focus-card .footer-action { color: #7f8892; }
    .focus-card .footer-action:hover { color: #edf0f2; }
    .focus-card .brand-mark { color: #c5ccd2; }

    .prototype-toast {
      position: absolute;
      right: 18px;
      bottom: 68px;
      max-width: 240px;
      padding: 9px 12px;
      border-radius: 9px;
      background: rgba(32, 35, 40, .92);
      color: #fff;
      font-size: 11px;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 150ms ease-out, transform 150ms ease-out;
    }

    .prototype-toast.is-visible { opacity: 1; transform: translateY(0); }

    .settings-sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2147483648;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(20, 24, 28, .18);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      animation: settings-fade-in 160ms ease-out both;
    }

    .settings-sheet {
      width: min(360px, calc(100vw - 40px));
      padding: 22px;
      border: 1px solid rgba(24, 29, 34, .1);
      border-radius: 18px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 22px 60px rgba(35, 43, 50, .2), 0 2px 8px rgba(35, 43, 50, .08);
      color: #252a2f;
      animation: settings-sheet-in 220ms cubic-bezier(.23, 1, .32, 1) both;
    }

    @keyframes settings-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes settings-sheet-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

    .settings-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .settings-title { font-size: 18px; font-weight: 650; letter-spacing: -.03em; }
    .settings-subtitle { margin-top: 3px; color: #8b929b; font-size: 11px; }
    .settings-close {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #eef1f4;
      color: #6d7680;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .settings-section { display: grid; gap: 8px; }
    .settings-section + .settings-section { margin-top: 18px; }
    .settings-section-label { color: #8b929b; font-size: 10px; font-weight: 650; }
    .settings-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #f3f5f6;
    }

    .settings-card strong { display: block; font-size: 12px; font-weight: 600; }
    .settings-card p { margin: 3px 0 0; color: #8b929b; font-size: 10px; line-height: 1.35; }
    .settings-about { display: flex; align-items: center; gap: 10px; }
    .settings-about-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #e8ebee; color: #6d7680; font-size: 13px; }
    .settings-version { margin-left: auto; color: #8b929b; font-size: 10px; }

    .settings-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .settings-toggle-track { display: block; width: 34px; height: 20px; padding: 2px; border-radius: 999px; background: #cfd4da; cursor: pointer; transition: background-color 150ms ease-out; }
    .settings-toggle-track::after { display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); content: ""; transition: transform 150ms ease-out; }
    .settings-toggle input:checked + .settings-toggle-track { background: var(--kipless-accent); }
    .settings-toggle input:checked + .settings-toggle-track::after { transform: translateX(14px); }

    @media (max-width: 520px) {
      body { overflow: auto; }
      #stage { padding: 24px 14px 88px; }
      .mock-window { width: min(520px, calc(100vw - 28px)); }
      .mock-window.variant-quiet { width: min(520px, calc(100vw - 28px)); }
      .popover-body { grid-template-columns: 1fr; }
      .quiet-body { aspect-ratio: auto; }
      .quiet-left, .rail-left, .focus-right { border-right: 0; border-left: 0; border-bottom: 1px solid rgba(24, 29, 34, .08); }
      .quiet-left { padding: 24px; }
      .quiet-right, .rail-right, .focus-left, .focus-right { padding: 26px 24px; }
      .rail-left { grid-template-columns: 20px 1fr; min-height: 260px; }
      .rail-track { height: 132px; }
      .focus-right { border-color: rgba(255, 255, 255, .09); }
      .popover-footer { padding: 0 18px; }
    }

    /* Prototype picker chrome — intentionally kept verbatim. */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }

    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  </style>
</head>
<body>
  <main id="stage" aria-live="polite"></main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quiet</button>
    <button class="proto-picker-item">Rail</button>
    <button class="proto-picker-item">Focus</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const variants = [
      () => `
        <section class="mock-window variant-quiet" data-variant="quiet" data-start-label="Start" data-active-label="Keeping awake">
          <p class="eyebrow">01 · Quiet Ring</p>
          <div class="popover-card quiet-card">
            <div class="popover-body quiet-body">
              <div class="quiet-left">
                <div class="quiet-timer" aria-label="Session time remaining">
                  <svg class="quiet-ring" viewBox="0 0 148 148" aria-hidden="true">
                    <circle class="ring-track" cx="74" cy="74" r="68"></circle>
                    <circle class="ring-progress" data-progress-ring cx="74" cy="74" r="68"></circle>
                  </svg>
                <div class="quiet-time">
                    <strong class="quiet-time-value" data-time>30:00</strong>
                    <button class="quiet-ring-action" data-action="session" aria-label="Start session">
                      <span class="quiet-action-icon quiet-play-icon" aria-hidden="true"></span>
                      <span class="sr-only" data-action-label>Start session</span>
                    </button>
                  </div>
                </div>
                <span class="sr-only" data-alert role="status"></span>
              </div>
              <div class="quiet-right">
                <div class="quiet-options mode-list" role="radiogroup" aria-label="Wake mode">
                  <label class="mode-choice">
                    <input type="radio" name="quiet-mode" value="system" data-config data-mode-option="system" checked>
                    <span class="mode-radio" aria-hidden="true"></span>
                    <span class="option-copy"><span class="option-title">Keep Mac Awake</span><span class="option-note">The display may sleep normally.</span></span>
                  </label>
                  <label class="mode-choice">
                    <input type="radio" name="quiet-mode" value="display" data-config data-mode-option="display">
                    <span class="mode-radio" aria-hidden="true"></span>
                    <span class="option-copy"><span class="option-title">Keep Mac + Display Awake</span><span class="option-note">Keep the screen on; Mac wake is included.</span></span>
                  </label>
                </div>
                <label class="quiet-duration-control" for="quiet-duration">Duration
                  <select id="quiet-duration" data-config data-duration-select class="quiet-duration-select">
                  <option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option><option value="until">Until stopped</option>
                  </select>
                </label>
              </div>
            </div>
            <div class="popover-footer">
              <span class="brand-lockup"><span class="brand-mark"></span>Kipless</span>
              <span class="footer-actions"><button class="footer-action" data-action="settings">Settings</button></span>
            </div>
            <div class="prototype-toast" data-toast role="status"></div>
          </div>
        </section>
      `,
      () => `
        <section class="mock-window variant-rail" data-variant="rail" data-start-label="Start session" data-active-label="Session running">
          <p class="eyebrow">02 · Progress Rail</p>
          <div class="popover-card rail-card">
            <div class="popover-body rail-body">
              <div class="rail-left">
                <div class="rail-track" aria-hidden="true">
                  <div class="rail-fill" data-progress-fill></div>
                  <div class="rail-markers"><i class="rail-marker"></i><i class="rail-marker"></i><i class="rail-marker"></i><i class="rail-marker"></i><i class="rail-marker"></i></div>
                </div>
                <div class="rail-time-block">
                  <div class="rail-kicker">Time remaining</div>
                  <div class="rail-time" data-time>30:00</div>
                  <div class="rail-state" data-status>Ready to start</div>
                  <div class="rail-durations" role="group" aria-label="Duration">
                    <button class="duration-choice" data-config data-duration="15" aria-pressed="false">15m</button>
                    <button class="duration-choice" data-config data-duration="30" aria-pressed="true">30m</button>
                    <button class="duration-choice" data-config data-duration="60" aria-pressed="false">1h</button>
                    <button class="duration-choice" data-config data-duration="120" aria-pressed="false">2h</button>
                    <button class="duration-choice" data-config data-duration="until" aria-pressed="false">∞</button>
                  </div>
                </div>
              </div>
              <div class="rail-right">
                <div class="rail-heading"><div class="rail-title">Hold awake</div><div class="rail-status" data-state-label>Inactive</div></div>
                <div class="rail-options mode-list" role="radiogroup" aria-label="Wake mode">
                  <label class="mode-choice">
                    <input type="radio" name="rail-mode" value="system" data-config data-mode-option="system" checked>
                    <span class="mode-radio" aria-hidden="true"></span>
                    <span class="option-copy"><span class="option-title">Keep Mac Awake</span><span class="option-note">The display may sleep normally.</span></span>
                  </label>
                  <label class="mode-choice">
                    <input type="radio" name="rail-mode" value="display" data-config data-mode-option="display">
                    <span class="mode-radio" aria-hidden="true"></span>
                    <span class="option-copy"><span class="option-title">Keep Mac + Display Awake</span><span class="option-note">Keep the screen on; Mac wake is included.</span></span>
                  </label>
                </div>
                <button class="primary-action rail-start" data-action="session">Start session</button>
                <span class="sr-only" data-alert role="status"></span>
              </div>
            </div>
            <div class="popover-footer"><span class="brand-lockup"><span class="brand-mark"></span>Kipless</span><span class="footer-actions"><button class="footer-action" data-action="settings">Settings</button></span></div>
            <div class="prototype-toast" data-toast role="status"></div>
          </div>
        </section>
      `,
      () => `
        <section class="mock-window variant-focus" data-variant="focus" data-start-label="Begin session" data-active-label="Keeping awake" data-idle-label="Ready">
          <p class="eyebrow">03 · Focus Surface</p>
          <div class="popover-card focus-card">
            <div class="popover-body focus-body">
              <div class="focus-left">
                <div class="focus-header"><span class="focus-label">Kipless session</span><span class="focus-live" data-status>Ready</span></div>
                <div class="focus-time" data-time>30:00</div>
                <div class="focus-subline" data-time-note>30 minutes selected</div>
                <div class="focus-timeline" aria-hidden="true">
                  <div class="focus-timeline-track"></div><div class="focus-timeline-fill" data-progress-fill></div><div class="focus-timeline-dot" data-progress-dot></div>
                </div>
                <div class="focus-timeline-labels"><span>now</span><span data-end-label>30 min</span></div>
                <div class="focus-durations" role="group" aria-label="Duration">
                  <button class="duration-choice" data-config data-duration="15" aria-pressed="false">15m</button>
                  <button class="duration-choice" data-config data-duration="30" aria-pressed="true">30m</button>
                  <button class="duration-choice" data-config data-duration="60" aria-pressed="false">1h</button>
                  <button class="duration-choice" data-config data-duration="120" aria-pressed="false">2h</button>
                  <button class="duration-choice" data-config data-duration="until" aria-pressed="false">∞</button>
                </div>
              </div>
              <div class="focus-right">
                <div class="focus-right-heading"><div class="focus-title">Sleep behavior</div><div class="focus-note">These options lock once the session begins.</div></div>
                <div class="focus-options mode-list" role="radiogroup" aria-label="Wake mode">
                  <label class="mode-choice">
                    <input type="radio" name="focus-mode" value="system" data-config data-mode-option="system" checked>
                    <span class="mode-radio" aria-hidden="true"></span>
                    <span class="option-copy"><span class="option-title">Keep Mac Awake</span><span class="option-note">The display may sleep normally.</span></span>
                  </label>
                  <label class="mode-choice">
                    <input type="radio" name="focus-mode" value="display" data-config data-mode-option="display">
                    <span class="mode-radio" aria-hidden="true"></span>
                    <span class="option-copy"><span class="option-title">Keep Mac + Display Awake</span><span class="option-note">Keep the screen on; Mac wake is included.</span></span>
                  </label>
                </div>
                <button class="primary-action focus-start" data-action="session">Begin session</button>
                <span class="sr-only" data-alert role="status"></span>
              </div>
            </div>
            <div class="popover-footer"><span class="brand-lockup"><span class="brand-mark"></span>Kipless</span><span class="footer-actions"><button class="footer-action" data-action="settings">Settings</button></span></div>
            <div class="prototype-toast" data-toast role="status"></div>
          </div>
        </section>
      `
    ];

    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;
    let timerId = null;
    let expiresAt = null;
    let running = false;

    function resetDemoTimer() {
      if (timerId) window.clearInterval(timerId);
      timerId = null;
      expiresAt = null;
      running = false;
    }

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      resetDemoTimer();
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); wireVariant(); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
    }

    function showSettings() {
      if (document.querySelector('[data-settings-sheet]')) return;

      const backdrop = document.createElement('div');
      backdrop.className = 'settings-sheet-backdrop';
      backdrop.dataset.settingsSheet = '';
      backdrop.setAttribute('role', 'dialog');
      backdrop.setAttribute('aria-modal', 'true');
      backdrop.setAttribute('aria-label', 'Kipless Settings');
      backdrop.innerHTML = `
        <section class="settings-sheet">
          <header class="settings-header">
            <div><div class="settings-title">Settings</div><div class="settings-subtitle">Kipless</div></div>
            <button class="settings-close" type="button" data-settings-close aria-label="Close settings">×</button>
          </header>
          <div class="settings-section">
            <div class="settings-section-label">General</div>
            <div class="settings-card">
              <div><strong>Launch at Login</strong><p>Start Kipless automatically when you sign in.</p></div>
              <label class="settings-toggle" aria-label="Launch at Login"><input type="checkbox"><span class="settings-toggle-track"></span></label>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-section-label">About</div>
            <div class="settings-card">
              <div class="settings-about"><span class="settings-about-mark">ϟ</span><div><strong>Lightweight and private.</strong><p>No accounts, telemetry, or network connections.</p></div></div>
              <span class="settings-version">v1.0.0</span>
            </div>
          </div>
        </section>
      `;
      backdrop.addEventListener('click', event => {
        if (event.target === backdrop || event.target.closest('[data-settings-close]')) backdrop.remove();
      });
      document.body.append(backdrop);
      backdrop.querySelector('[data-settings-close]').focus();
    }

    function wireVariant() {
      const root = stage.firstElementChild;
      document.body.dataset.prototype = root.dataset.variant;
      const time = root.querySelector('[data-time]');
      const timeNote = root.querySelector('[data-time-note]');
      const status = root.querySelector('[data-status]');
      const stateLabel = root.querySelector('[data-state-label]');
      const startButton = root.querySelector('[data-action="session"]');
      const config = [...root.querySelectorAll('[data-config]')];
      const modeOptions = [...root.querySelectorAll('[data-mode-option]')];
      const durationSelect = root.querySelector('[data-duration-select]');
      const durationButtons = [...root.querySelectorAll('[data-duration]')];
      const progressRing = root.querySelector('[data-progress-ring]');
      const progressFill = root.querySelector('[data-progress-fill]');
      const progressDot = root.querySelector('[data-progress-dot]');
      const endLabel = root.querySelector('[data-end-label]');
      const alert = root.querySelector('[data-alert]');
      const actionIcon = root.querySelector('.quiet-action-icon');
      const actionLabel = root.querySelector('[data-action-label]');
      let selectedDuration = durationSelect?.value || '30';
      let totalSeconds = selectedDuration === 'until' ? null : Number(selectedDuration) * 60;
      const ringCircumference = 427.3;
      const ringGap = 16;

      function setActionState(active) {
        if (actionIcon) {
          actionIcon.classList.toggle('quiet-play-icon', !active);
          actionIcon.classList.toggle('quiet-stop-icon', active);
        }
        if (actionLabel) actionLabel.textContent = active ? 'Stop session' : 'Start session';
        startButton.setAttribute('aria-label', active ? 'Stop session' : 'Start session');
        if (active) startButton.setAttribute('data-stop', '');
        else startButton.removeAttribute('data-stop');
      }

      function setProgress(value) {
        const fraction = Math.max(0, Math.min(1, value));
        root.style.setProperty('--progress', fraction);
        if (progressRing) {
          const activeLength = Math.max(0, ringCircumference * fraction - (fraction > 0 ? ringGap : 0));
          progressRing.style.strokeDasharray = `${activeLength} ${Math.max(0, ringCircumference - activeLength)}`;
          progressRing.style.strokeDashoffset = '0';
        }
      }

      function durationText(value) {
        if (value === 'until') return 'Until stopped';
        const minutes = Number(value);
        return minutes >= 60 ? `${minutes / 60} hour${minutes === 60 ? '' : 's'}` : `${minutes} minutes`;
      }

      function renderIdle(message = '') {
        if (selectedDuration === 'until') {
          time.textContent = '∞';
          if (timeNote) timeNote.textContent = 'until stopped';
          if (endLabel) endLabel.textContent = 'no end time';
          setProgress(1);
        } else {
          time.textContent = formatTime(Number(selectedDuration) * 60);
          if (timeNote) timeNote.textContent = 'selected duration';
          if (endLabel) endLabel.textContent = durationText(selectedDuration).replace(' minutes', ' min').replace(' hour', ' hr').replace('s', '');
          setProgress(1);
        }
        if (status) status.textContent = root.dataset.idleLabel || (root.dataset.activeLabel === 'Session running' ? 'Ready to start' : 'Ready when you are');
        if (stateLabel) stateLabel.textContent = 'Inactive';
        if (!actionIcon) startButton.textContent = root.dataset.startLabel;
        setActionState(false);
        root.classList.remove('is-running');
        if (message) alert.textContent = message;
      }

      function selectDuration(value) {
        selectedDuration = value;
        totalSeconds = value === 'until' ? null : Number(value) * 60;
        if (durationSelect) durationSelect.value = value;
        durationButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.duration === value)));
        renderIdle();
      }

      function tick() {
        if (!running) return;
        if (expiresAt === null) {
          time.textContent = '∞';
          if (timeNote) timeNote.textContent = 'until stopped';
          setProgress(1);
          return;
        }
        const remaining = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
        time.textContent = formatTime(remaining);
        if (timeNote) timeNote.textContent = 'remaining';
        setProgress(remaining / totalSeconds);
        if (remaining <= 0) finish('Session complete');
      }

      function finish(message) {
        resetDemoTimer();
        config.forEach(control => { control.disabled = false; control.closest('.option-row, .mode-choice, .duration-choice')?.classList.remove('is-disabled'); });
        renderIdle(message);
      }

      function start() {
        if (!modeOptions.some(option => option.checked)) {
          alert.textContent = 'Choose a wake mode.';
          return;
        }
        running = true;
        expiresAt = totalSeconds === null ? null : Date.now() + totalSeconds * 1000;
        config.forEach(control => { control.disabled = true; control.closest('.option-row, .mode-choice, .duration-choice')?.classList.add('is-disabled'); });
        root.classList.add('is-running');
        if (!actionIcon) startButton.textContent = 'Stop';
        setActionState(true);
        if (status) status.textContent = root.dataset.activeLabel;
        if (stateLabel) stateLabel.textContent = 'Active';
        alert.textContent = '';
        tick();
        timerId = window.setInterval(tick, 250);
      }

      durationSelect?.addEventListener('change', event => selectDuration(event.target.value));
      durationButtons.forEach(button => button.addEventListener('click', () => selectDuration(button.dataset.duration)));
      startButton.addEventListener('click', () => running ? finish('Session stopped') : start());
      root.querySelector('[data-action="settings"]')?.addEventListener('click', showSettings);
      renderIdle();
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
      else if (e.key === 'Escape') document.querySelector('[data-settings-sheet]')?.remove();
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>

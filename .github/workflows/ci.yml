name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Debug unit tests
        run: |
          xcodebuild test \
            -project Kipless.xcodeproj \
            -scheme Kipless \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build power test helper
        run: |
          xcodebuild build \
            -project Kipless.xcodeproj \
            -scheme KiplessPowerTestHelper \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build sleep helper
        run: |
          xcodebuild build \
            -project Kipless.xcodeproj \
            -scheme KiplessSleepHelper \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Release build
        run: |
          xcodebuild build \
            -project Kipless.xcodeproj \
            -scheme Kipless \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

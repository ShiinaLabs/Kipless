name: Release

# Builds, signs, notarizes and publishes a DMG. Only runs on a version tag (or
# by hand), so it never fires on ordinary pushes.
#
# Required organization secrets / variables:
#   APPLE_DEVELOPER_ID_CERTIFICATE_BASE64     base64 of the Developer ID Application .p12
#   APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD   password for that .p12
#   APPLE_TEAM_ID                             Developer Team ID (organization variable)
#   APPLE_ID                                  Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD               app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (e.g. 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'tag=v%s\n' "$VERSION"
            printf 'build=%s\n' "$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/kipless.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Kipless.xcodeproj \
            -scheme Kipless \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Kipless.xcarchive" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>            <string>developer-id</string>
            <key>signingStyle</key>      <string>manual</string>
            <key>teamID</key>            <string>TEAM_ID_PLACEHOLDER</string>
            <key>destination</key>       <string>export</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kipless.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Build DMG
        id: dmg
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$RUNNER_TEMP/export/Kipless.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          DMG="$RUNNER_TEMP/Kipless.dmg"
          hdiutil create -volname "Kipless" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.path }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "${{ steps.dmg.outputs.path }}"

      - name: Verify
        run: |
          xcrun stapler validate "${{ steps.dmg.outputs.path }}"
          spctl --assess --type install -v \
            "${{ steps.dmg.outputs.path }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.dmg.outputs.path }}" --clobber
          else
            gh release create "$TAG" \
              "${{ steps.dmg.outputs.path }}" \
              --title "Kipless ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

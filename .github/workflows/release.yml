name: Release

# Builds, signs, notarizes and publishes a DMG. Only runs on a version tag (or
# by hand), so it never fires on ordinary pushes.
#
# Required organization secrets / variables:
#   APPLE_DEVELOPER_ID_CERTIFICATE_BASE64     base64 of the Developer ID Application .p12
#   APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD   password for that .p12
#   APPLE_TEAM_ID                             Developer Team ID (organization variable)
#   APPLE_ID                                  Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD               app-specific password for that Apple ID
#   SPARKLE_ED25519_PRIVATE_KEY               Sparkle's EdDSA private key, for the appcast

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (e.g. 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Keep in step with the Swift package requirement in project.pbxproj. The
      # tools that sign the appcast have to match the framework that validates
      # it on the client.
      SPARKLE_VERSION: "2.9.6"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'tag=v%s\n' "$VERSION"
            printf 'build=%s\n' "$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Check the tag is newer than the last release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Two reasons this is a hard stop. Sparkle decides what to offer by
          # comparing versions, and the feed below hangs off "the latest
          # release" — so a lower version published after a higher one would
          # stop offering the higher one to everyone who already has it, and no
          # client could recover from that on its own.
          LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$LATEST" ]; then
            echo "No published release to compare against."
            exit 0
          fi
          NEWEST="$(printf '%s\n%s\n' "${LATEST#v}" "$VERSION" | sort -V | tail -1)"
          if [ "$NEWEST" != "$VERSION" ]; then
            echo "Refusing to publish $VERSION: $LATEST is newer." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/kipless.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Kipless.xcodeproj \
            -scheme Kipless \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Kipless.xcarchive" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>            <string>developer-id</string>
            <key>signingStyle</key>      <string>manual</string>
            <key>teamID</key>            <string>TEAM_ID_PLACEHOLDER</string>
            <key>destination</key>       <string>export</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kipless.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify helper packaging
        run: |
          APP="$RUNNER_TEMP/export/Kipless.app"
          HELPER="$APP/Contents/MacOS/KiplessSleepHelper"
          PLIST="$APP/Contents/Library/LaunchDaemons/com.kaoru.kipless.lidsleep.plist"
          test -x "$HELPER"
          test -f "$PLIST"
          plutil -lint "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Label' "$PLIST")" = "com.kaoru.kipless.lidsleep"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$PLIST")" = "Contents/MacOS/KiplessSleepHelper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MachServices:com.kaoru.kipless.lidsleep' "$PLIST")" = "true"

      - name: Verify Sparkle packaging
        run: |
          # Sparkle brings nested code — XPC services, an updater app — and
          # notarization rejects the DMG if any of it is unsigned or signed
          # with a different team. The XPC directory is the part that goes
          # missing first if embedding regresses, and Sparkle cannot update at
          # all without it.
          APP="$RUNNER_TEMP/export/Kipless.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          test -d "$SPARKLE"
          test -d "$SPARKLE/Versions/Current/XPCServices"
          test -f "$APP/Contents/Info.plist"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist")"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Download Sparkle tools
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP"
          SPARKLE_BIN_DIR="$(dirname "$(find "$RUNNER_TEMP" -name generate_appcast -type f | head -1)")"
          test -n "$SPARKLE_BIN_DIR"
          echo "$SPARKLE_BIN_DIR" >> "$GITHUB_PATH"

      - name: Build DMG
        id: dmg
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$RUNNER_TEMP/export/Kipless.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          DMG="$RUNNER_TEMP/Kipless.dmg"
          hdiutil create -volname "Kipless" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.path }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "${{ steps.dmg.outputs.path }}"

      - name: Verify
        run: |
          xcrun stapler validate "${{ steps.dmg.outputs.path }}"
          spctl --assess --type install -v \
            "${{ steps.dmg.outputs.path }}"

      - name: Generate signed appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          # Sparkle signs the archive itself; there is no separate signing step.
          # The key here and SUPublicEDKey in Info.plist have to be a matching
          # pair — a mismatch fails silently, on the client, at install time.
          ED_KEY="$RUNNER_TEMP/sparkle-ed-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$ED_KEY"

          APPCAST_DIR="$RUNNER_TEMP/appcast"
          mkdir -p "$APPCAST_DIR"
          cp "${{ steps.dmg.outputs.path }}" "$APPCAST_DIR/"

          # The prefix has to end in a slash: the enclosure URL is built by
          # joining it to the file name.
          generate_appcast \
            --ed-key-file "$ED_KEY" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            -o "$APPCAST_DIR/appcast.xml" \
            "$APPCAST_DIR"

          rm -f "$ED_KEY"
          test -f "$APPCAST_DIR/appcast.xml"
          echo "path=$APPCAST_DIR/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # The appcast is a release asset with a stable name: SUFeedURL points
          # at releases/latest/download/appcast.xml, which only resolves if
          # every release carries it.
          ASSETS=(
            "${{ steps.dmg.outputs.path }}"
            "${{ steps.appcast.outputs.path }}"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Kipless ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

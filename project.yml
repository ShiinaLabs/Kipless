name: Kipless

options:
  bundleIdPrefix: com.kaoru
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

attributes:
  ORGANIZATIONNAME: ShiinaLabs

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    # Ad-hoc signing so anyone can clone and hit Run without a developer account.
    # Release builds override this with a Developer ID identity (see .github/workflows/release.yml).
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES

targets:
  Kipless:
    type: application
    platform: macOS
    sources:
      - path: Kipless
        excludes:
          - Info.plist
    resources:
      - path: Kipless/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaoru.kipless
        PRODUCT_NAME: Kipless
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Kipless/Info.plist
      properties:
        CFBundleName: Kipless
        CFBundleDisplayName: Kipless
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar only: no Dock icon, no app switcher entry.
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Kaoru. Licensed under MPL-2.0.

  KiplessPowerTestHelper:
    type: tool
    platform: macOS
    sources:
      - path: KiplessPowerTestHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaoru.kipless.power-test-helper
        PRODUCT_NAME: KiplessPowerTestHelper

  KiplessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KiplessTests
    dependencies:
      - target: Kipless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaoru.kipless.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kipless.app/Contents/MacOS/Kipless

schemes:
  KiplessPowerTestHelper:
    build:
      targets:
        KiplessPowerTestHelper: all

  Kipless:
    build:
      targets:
        Kipless: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KiplessTests
    archive:
      config: Release
